<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Errand design system · gallery</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../packages/design-tokens/tokens.css">
<style>
/* Gallery styles read semantic roles only. build_gallery.py inlines tokens.css for the checked copy. */
*{box-sizing:border-box}
body{margin:0;font-family:var(--font-sans);font-size:var(--text-body);background:var(--surface-well);color:var(--fg-body)}
.page-head{padding:var(--space-4) var(--space-4) 0;color:var(--fg-emph)}
.page-head h1{margin:0;font-size:var(--text-title);font-weight:var(--weight-strong)}
.page-head p{margin:var(--space-1) 0 0;color:var(--fg-meta)}
.themes{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:var(--space-3);padding:var(--space-4)}
.ds{background:var(--surface-canvas);color:var(--fg-body);border:1px solid var(--edge);border-radius:var(--radius-3);padding:var(--space-4);display:grid;gap:var(--space-5);align-content:start;min-width:0}
.ds-title{display:flex;justify-content:space-between;align-items:center;color:var(--fg-emph);font-weight:var(--weight-strong);font-size:var(--text-panel)}
section h2{margin:0 0 var(--space-2);font-size:var(--text-meta);font-weight:var(--weight-medium);letter-spacing:.06em;text-transform:uppercase;color:var(--fg-meta)}
.stack{display:grid;gap:var(--space-2)}
.line{display:flex;flex-wrap:wrap;gap:var(--space-2);align-items:center}
.mono,.num{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.meta{font-family:var(--font-mono);font-size:var(--text-meta);color:var(--fg-meta)}
.emph{color:var(--fg-emph)}

/* swatches */
.sw{display:grid;grid-template-columns:repeat(auto-fill,minmax(66px,1fr));gap:var(--space-1)}
.sw div{border:1px solid var(--edge);border-radius:var(--radius-2);overflow:hidden;font-size:var(--text-meta);color:var(--fg-meta);background:var(--surface-card)}
.sw i{display:block;height:26px;background:var(--c)}
.sw span{display:block;padding:2px var(--space-1);font-family:var(--font-mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.type div{display:flex;align-items:baseline;gap:var(--space-3);color:var(--fg-emph);min-width:0}
.type .meta{width:56px;flex:none}

/* foundations */
.btn{font:inherit;font-size:var(--text-label);font-weight:var(--weight-medium);border-radius:var(--radius-2);padding:5px var(--space-3);min-height:28px;border:1px solid var(--edge-strong);background:var(--surface-card);color:var(--fg-emph);cursor:pointer;display:inline-flex;gap:6px;align-items:center;transition:background var(--dur-micro) var(--ease-out)}
.btn:hover{background:var(--surface-raised)}
.btn:focus-visible,.btn.is-focus{outline:2px solid var(--ring);outline-offset:2px}
.btn.primary{background:var(--primary);color:var(--primary-foreground);border-color:var(--primary)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--fg-body)}
.btn.danger{background:var(--err-tint);color:var(--err);border-color:color-mix(in oklab,var(--err) 40%,transparent)}
.btn.sm{min-height:22px;padding:2px var(--space-2);font-size:var(--text-meta)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.chip{display:inline-flex;gap:5px;align-items:center;border:1px solid var(--edge);border-radius:var(--radius-2);padding:3px 7px;font-size:var(--text-label);background:var(--surface-canvas);color:var(--fg-meta)}
.chip b{font-weight:var(--weight-regular);color:var(--fg-emph)}
.chip.is-on{border-color:var(--interactive);background:var(--interactive-tint);color:var(--fg-emph)}
.chip.suggest{border-style:dashed;border-radius:var(--radius-pill)}
.chip.inferred{border-style:dashed;border-color:color-mix(in oklab,var(--warn) 55%,transparent);color:var(--warn)}
.badge{display:inline-grid;place-items:center;min-width:16px;height:16px;padding:0 4px;border-radius:var(--radius-1);font-size:var(--text-meta);font-weight:var(--weight-strong);font-family:var(--font-mono)}
.badge.count{background:var(--warn-fill);color:var(--on-warn-fill)}
.badge.alert{background:var(--err-fill);color:var(--on-err-fill)}
.tag{font-size:var(--text-meta);border:1px solid var(--edge);border-radius:var(--radius-1);padding:1px 5px;color:var(--fg-meta)}
.tag.ok{color:var(--ok);border-color:color-mix(in oklab,var(--ok) 40%,transparent)}
.tag.warn{color:var(--warn);border-color:color-mix(in oklab,var(--warn) 45%,transparent);border-style:dashed}
.status{display:inline-flex;gap:5px;align-items:center;font-size:var(--text-label);color:var(--fg-body)}
.status i{font-style:normal;width:14px;text-align:center}
.t-ok{color:var(--ok)}.t-warn{color:var(--warn)}.t-err{color:var(--err)}.t-info{color:var(--info)}.t-meta{color:var(--fg-meta)}
.spin{width:10px;height:10px;border:2px solid var(--info);border-right-color:transparent;border-radius:50%;flex:none;animation:spin var(--dur-spin) linear infinite}
@keyframes spin{to{transform:rotate(1turn)}}
.skel{height:10px;border-radius:var(--radius-1);background:var(--surface-raised)}
.kbd{font-family:var(--font-mono);font-size:var(--text-meta);border:1px solid var(--edge-strong);border-bottom-width:2px;border-radius:var(--radius-1);padding:0 4px;color:var(--fg-meta)}
.mono-av{width:24px;height:24px;border-radius:var(--radius-2);display:grid;place-items:center;font-size:var(--text-meta);font-weight:var(--weight-strong);color:var(--fg-emph);background:color-mix(in oklab,var(--av) 28%,var(--surface-card));border:1px solid color-mix(in oklab,var(--av) 45%,transparent);flex:none}
.tabs{display:flex;gap:var(--space-4);font-size:var(--text-label);color:var(--fg-meta);border-bottom:1px solid var(--edge)}
.tabs span{padding-bottom:6px}.tabs .on{color:var(--fg-emph);box-shadow:inset 0 -2px 0 var(--fg-emph)}
.seg{display:inline-flex;border:1px solid var(--edge);border-radius:var(--radius-2);padding:2px;background:var(--surface-well)}
.seg span{font-size:var(--text-label);padding:2px var(--space-2);border-radius:var(--radius-1);color:var(--fg-meta)}
.seg .on{background:var(--surface-raised);color:var(--fg-emph)}
.toast{display:flex;gap:var(--space-2);align-items:center;background:var(--surface-raised);border:1px solid var(--edge-strong);border-radius:var(--radius-2);padding:var(--space-2) var(--space-3);box-shadow:var(--shadow-pop);color:var(--fg-emph);font-size:var(--text-label)}
.empty{border:1px dashed var(--edge-strong);border-radius:var(--radius-3);padding:var(--space-4);text-align:center;color:var(--fg-meta);display:grid;gap:var(--space-2);justify-items:center}

/* widget + rows */
.w{background:var(--surface-card);border:1px solid var(--edge);border-radius:var(--radius-3);padding:10px 11px}
.wh{display:flex;gap:6px;align-items:center;font-size:var(--text-label);color:var(--fg-meta);margin-bottom:var(--space-2)}
.wh .n{color:var(--fg-emph)}.wh .act{margin-left:auto}
.row{display:flex;gap:var(--space-2);align-items:center;padding:4px 0}
.row .grow{flex:1;min-width:0}.row .t{color:var(--fg-emph);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{width:7px;height:7px;border-radius:50%;flex:none;background:var(--warn)}
.bars{display:flex;align-items:flex-end;gap:4px;height:48px;margin-top:6px}
.bars div{flex:1;background:var(--chart-1);border-radius:2px 2px 0 0}
.kpi{font-size:var(--text-kpi);font-weight:var(--weight-strong);color:var(--fg-emph);font-family:var(--font-mono)}

/* fixed trust components */
.trust{background:var(--surface-card);border:1px solid var(--edge-strong);border-radius:var(--radius-3);overflow:hidden}
.trust-h{display:flex;gap:var(--space-2);align-items:center;padding:var(--space-2) var(--space-3);border-bottom:1px solid var(--edge);font-size:var(--text-label);color:var(--fg-meta)}
.trust-h b{color:var(--fg-emph);font-weight:var(--weight-strong);font-size:var(--text-body)}
.trust-h .tag,.trust-h .badge{margin-left:auto}
.kv{display:grid;grid-template-columns:64px 1fr;gap:6px var(--space-3);padding:var(--space-3);margin:0;font-size:var(--text-body)}
.kv dt{color:var(--fg-meta)}.kv dd{margin:0;color:var(--fg-emph);display:flex;gap:6px;align-items:center}
.trust-note{padding:0 var(--space-3) var(--space-2);font-size:var(--text-label);color:var(--fg-meta)}
.trust-a{display:flex;flex-wrap:wrap;gap:var(--space-2);padding:var(--space-2) var(--space-3) var(--space-3)}
.trust.voided{border-color:color-mix(in oklab,var(--err) 45%,transparent)}
.trust.voided .kv{opacity:.6}
.notice{display:flex;gap:var(--space-2);align-items:flex-start;padding:var(--space-2) var(--space-3);font-size:var(--text-label);color:var(--fg-emph)}
.notice.err{background:var(--err-tint)}.notice.info{background:var(--interactive-tint)}.notice.ok{background:var(--ok-tint)}
.notice .spin{margin-top:2px}
s{color:var(--fg-meta)}
.alert{border-left:3px solid var(--err)}
.fact{display:flex;gap:var(--space-2);align-items:center;padding:6px var(--space-2);border:1px solid var(--edge);border-radius:var(--radius-2);background:var(--surface-card)}
.fact .grow{flex:1;min-width:0}
.fact.inferred{border-style:dashed;border-color:color-mix(in oklab,var(--warn) 55%,transparent)}
.fact.tomb{background:transparent;border-style:dotted}
.fact.tomb .t{text-decoration:line-through;color:var(--fg-meta)}

/* generated (OpenUI) */
.gen{position:relative;border:1px solid var(--edge);border-radius:var(--radius-3);padding:var(--space-3) var(--space-2) var(--space-2);background:var(--surface-canvas)}
.gen-label{position:absolute;top:-8px;left:var(--space-2);background:var(--surface-canvas);padding:0 4px;font-size:var(--text-meta);color:var(--fg-meta);font-family:var(--font-mono)}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--space-2)}
.pcard{background:var(--surface-card);border:1px solid var(--edge);border-radius:var(--radius-3);overflow:hidden;display:flex;flex-direction:column;min-width:0}
.pcard.is-on{border-color:var(--interactive);box-shadow:0 0 0 1px var(--interactive)}
.photo{height:62px;background:linear-gradient(135deg,color-mix(in oklab,var(--p1) 70%,var(--surface-raised)),color-mix(in oklab,var(--p2) 55%,var(--surface-well)));display:flex;align-items:flex-start;justify-content:flex-end;padding:5px;font-size:18px}
.photo .tag{background:var(--surface-glass);border-color:var(--edge-glass);color:var(--fg-emph);margin-right:auto;white-space:nowrap}
.pbody{padding:6px;display:grid;gap:3px;flex:1}
.pbody .t{color:var(--fg-emph);font-weight:var(--weight-medium);font-size:var(--text-label);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.why{font-size:var(--text-meta);color:var(--fg-body)}
.pact{display:flex;flex-direction:column;gap:4px;padding:0 6px 6px}
.pact .btn{flex:1;justify-content:center;padding:2px 4px}
.slots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--space-2)}
.slots div{display:grid;gap:4px}
.slots .meta{text-align:center}
.slot{font-family:var(--font-mono);font-size:var(--text-label);text-align:center;border:1px solid var(--edge);border-radius:var(--radius-2);padding:3px 0;color:var(--fg-emph);background:var(--surface-card)}
.slot.is-on{border-color:var(--interactive);background:var(--interactive-tint)}
.slot.off{color:var(--fg-meta);text-decoration:line-through;background:transparent}
.hbar{display:grid;grid-template-columns:86px minmax(0,1fr) 44px;gap:var(--space-2);align-items:center;font-size:var(--text-label)}
.hbar i{display:block;height:8px;border-radius:2px;background:var(--chart-1)}
.hbar .num{text-align:right;color:var(--fg-emph)}

/* observability */
.wf{display:grid;gap:3px}
.wf div{display:grid;grid-template-columns:104px minmax(0,1fr) 34px;gap:var(--space-2);align-items:center;font-size:var(--text-meta);font-family:var(--font-mono);color:var(--fg-body)}
.wf b{font-weight:var(--weight-regular);position:relative;height:8px;background:var(--surface-raised);border-radius:2px}
.wf b::after{content:"";position:absolute;top:0;bottom:0;left:var(--ks);width:var(--kw);border-radius:2px;background:var(--kc,var(--chart-1))}
.wf .r{text-align:right;color:var(--fg-meta)}
.ctx{display:grid;gap:4px;font-size:var(--text-label)}
.ctx div{display:flex;gap:var(--space-2)}
.ctx .meta{margin-left:auto}
@media (max-width:420px){.cards{grid-template-columns:1fr 1fr}}
</style></head>
<body>
<div class="page-head"><h1>Errand design system</h1><p>Every component, dark and light, reading only from <span class="mono">tokens.css</span>.</p></div>
<div class="themes" id="themes"></div>

<template id="panel">
<div class="ds">
  <div class="ds-title"><span data-name>Dark</span><span class="meta" data-attr></span></div>

  <section><h2>Surfaces · text · tones</h2>
    <div class="sw">
      <div><i style="--c:var(--surface-well)"></i><span>well</span></div>
      <div><i style="--c:var(--surface-canvas)"></i><span>canvas</span></div>
      <div><i style="--c:var(--surface-card)"></i><span>card</span></div>
      <div><i style="--c:var(--surface-raised)"></i><span>raised</span></div>
      <div><i style="--c:var(--edge-strong)"></i><span>edge-strong</span></div>
      <div><i style="--c:var(--fg-emph)"></i><span>fg-emph</span></div>
      <div><i style="--c:var(--fg-body)"></i><span>fg-body</span></div>
      <div><i style="--c:var(--fg-meta)"></i><span>fg-meta</span></div>
      <div><i style="--c:var(--interactive)"></i><span>interactive</span></div>
      <div><i style="--c:var(--ok)"></i><span>ok</span></div>
      <div><i style="--c:var(--warn)"></i><span>warn</span></div>
      <div><i style="--c:var(--err)"></i><span>err</span></div>
      <div><i style="--c:var(--brand)"></i><span>brand</span></div>
      <div><i style="--c:linear-gradient(90deg,var(--cat-1) 0 16.6%,var(--cat-2) 0 33.3%,var(--cat-3) 0 50%,var(--cat-4) 0 66.6%,var(--cat-5) 0 83.3%,var(--cat-6) 0)"></i><span>cat-1…6</span></div>
    </div>
  </section>

  <section class="type"><h2>Type</h2>
    <div class="stack">
      <div><span class="meta">kpi 22</span><span class="kpi">₹7,450</span></div>
      <div><span class="meta">title 19</span><span style="font-size:var(--text-title);font-weight:var(--weight-strong)">What errand should I handle?</span></div>
      <div><span class="meta">panel 14</span><span style="font-size:var(--text-panel)">Approve booking</span></div>
      <div><span class="meta">body 12</span><span>Plumber for kitchen tap, this week</span></div>
      <div><span class="meta">mono 10</span><span class="meta">Thu 6 Nov · 09:00 · ₹899 · BK-7Q2M</span></div>
    </div>
  </section>

  <section><h2>Buttons</h2>
    <div class="stack">
      <div class="line"><button class="btn primary">Approve ₹899</button><button class="btn">Other options</button><button class="btn ghost">Decline</button><button class="btn danger">Cancel booking</button></div>
      <div class="line"><button class="btn is-focus">Focus ring</button><button class="btn" disabled>Disabled</button><button class="btn primary" aria-busy="true"><span class="spin"></span>Approving…</button><button class="btn sm">Review</button></div>
    </div>
  </section>

  <section><h2>Chips · badges · status</h2>
    <div class="stack">
      <div class="line"><span class="chip">📍 <b>Koramangala</b> ⌄</span><span class="chip is-on">₹ <b>Under ₹1,500</b> ⌄</span><span class="chip suggest">Plumber this week</span></div>
      <div class="line"><span class="chip">Area · Koramangala</span><span class="chip inferred">Prefers mornings?</span><span class="badge count">2</span><span class="badge alert">1</span><span class="tag">explicit</span><span class="tag warn">inferred</span><span class="tag ok">verified</span></div>
      <div class="line"><span class="status"><i class="t-ok">✓</i>Booked</span><span class="status"><span class="spin"></span>Checking</span><span class="status"><i class="t-meta">↻</i>Replacing</span><span class="status"><i class="t-err">✕</i>Cancelled</span><span class="status"><i class="t-warn">●</i>Needs you</span></div>
    </div>
  </section>

  <section><h2>Navigation · feedback</h2>
    <div class="stack">
      <div class="tabs"><span class="on">New errand</span><span>Running <span class="emph">1</span></span></div>
      <div class="line"><span class="seg"><span class="on">14 days</span><span>Month</span></span><span class="kbd">⌘K</span>
        <span class="mono-av" style="--av:var(--cat-1)">RP</span><span class="mono-av" style="--av:var(--cat-3)">CA</span><span class="mono-av" style="--av:var(--cat-4)">SK</span></div>
      <div class="toast"><span class="t-ok">✓</span>Booking approved · checking with the provider</div>
      <div class="w stack" aria-busy="true"><div class="skel" style="width:60%"></div><div class="skel" style="width:85%"></div><div class="skel" style="width:40%"></div></div>
      <div class="empty">No bookings yet.<button class="btn sm">Start an errand</button></div>
    </div>
  </section>

  <section><h2>Widgets</h2>
    <div class="stack">
      <div class="w">
        <div class="wh">◷ Waiting on you <span class="badge count">2</span></div>
        <div class="row"><span class="dot"></span><div class="grow"><div class="t">Approve booking · Ravi Plumbing</div><div class="meta">Thu 6 Nov · 09:00 · ₹899</div></div><button class="btn sm">Review</button></div>
        <div class="row"><span class="dot"></span><div class="grow"><div class="t">Confirm "prefers mornings"?</div><div class="meta">inferred from 3 bookings</div></div><button class="btn sm">Confirm</button></div>
      </div>
      <div class="w">
        <div class="wh">▥ Bookings · 14 days</div>
        <div class="line"><span class="kpi">6</span><span class="meta">bookings · ₹7,450 spent</span></div>
        <div class="bars"><div style="height:20%"></div><div style="height:45%"></div><div style="height:10%"></div><div style="height:2%"></div><div style="height:30%"></div><div style="height:60%"></div><div style="height:25%"></div><div style="height:5%"></div><div style="height:40%"></div><div style="height:80%"></div><div style="height:35%"></div><div style="height:2%"></div><div style="height:55%"></div><div style="height:90%"></div></div>
      </div>
    </div>
  </section>

  <section><h2>Fixed trust components · never generated</h2>
    <div class="stack">
      <div class="trust">
        <div class="trust-h"><b>Approve booking</b><span class="tag warn">needs you</span></div>
        <dl class="kv">
          <dt>Provider</dt><dd><span class="mono-av" style="--av:var(--cat-1)">RP</span>Ravi Plumbing <span class="meta">★ 4.7</span></dd>
          <dt>Job</dt><dd>Kitchen tap repair</dd>
          <dt>When</dt><dd class="mono">Thu 6 Nov · 09:00</dd>
          <dt>Price</dt><dd class="mono">₹899 <span class="meta">incl. visit fee</span></dd>
          <dt>Hold</dt><dd class="mono">8:42 left</dd>
        </dl>
        <div class="trust-note">Approving books exactly this. If the provider, time or price changes, I'll ask again.</div>
        <div class="trust-a"><button class="btn primary">Approve ₹899</button><button class="btn">Other options</button><button class="btn ghost">Decline</button></div>
      </div>
      <div class="trust voided">
        <div class="trust-h"><b>Approve booking</b><span class="tag">voided</span></div>
        <div class="notice err"><span class="t-err">✕</span><span>Price changed <s class="mono">₹899</s> → <span class="mono">₹1,050</span>. Nothing was booked.</span></div>
        <dl class="kv"><dt>Provider</dt><dd>Ravi Plumbing</dd><dt>When</dt><dd class="mono">Thu 6 Nov · 09:00</dd></dl>
        <div class="trust-a"><button class="btn primary">Review new price</button><button class="btn">Other options</button></div>
      </div>
      <div class="trust">
        <div class="notice info"><span class="spin"></span><span>Checking with the provider… The booking may already have gone through. I'll update you within 2 minutes, and I won't book twice.</span></div>
      </div>
      <div class="trust">
        <div class="trust-h"><span class="t-ok">✓</span><b>Booked</b><span class="tag ok">verified</span></div>
        <dl class="kv"><dt>Booking</dt><dd class="mono">BK-7Q2M</dd><dt>Provider</dt><dd>Ravi Plumbing</dd><dt>When</dt><dd class="mono">Thu 6 Nov · 09:00</dd><dt>Paid</dt><dd class="mono">₹899</dd></dl>
      </div>
      <div class="trust alert">
        <div class="row" style="padding:var(--space-2) var(--space-3)"><span class="t-err">✕</span><div class="grow"><div class="t">Sparkle cancelled your deep clean</div><div class="meta">Fri 14 Nov 11:00 · 2 replacements ready</div></div><button class="btn sm">See options</button></div>
      </div>
    </div>
  </section>

  <section><h2>Memory</h2>
    <div class="stack">
      <div class="fact"><div class="grow"><div class="t emph">Area · Koramangala</div><div class="meta">you said · 2 Nov</div></div><span class="tag">explicit</span><button class="btn sm ghost">Correct</button><button class="btn sm ghost">Forget</button></div>
      <div class="fact inferred"><div class="grow"><div class="t t-warn">Prefers mornings?</div><div class="meta">inferred from 3 bookings</div></div><button class="btn sm">Yes</button><button class="btn sm ghost">No</button></div>
      <div class="fact tomb"><div class="grow"><div class="t">Plumbing budget ≤ ₹1,000</div><div class="meta">forgotten 1 Nov · never used again</div></div></div>
    </div>
  </section>

  const themes = document.getElementById("themes");
  const panel = document.getElementById("panel");
  for (const theme of ["dark", "light"]) {
    const node = panel.content.cloneNode(true);
    const ds = node.querySelector(".ds");
    if (theme === "light") ds.dataset.theme = "light";
    node.querySelector("[data-name]").textContent = theme === "light" ? "Light" : "Dark";
    node.querySelector("[data-attr]").textContent = theme === "light" ? 'data-theme="light"' : "default";
    themes.append(node);
  }
